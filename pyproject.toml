[project]
name = "comex-fetcher"
version = "2.2.0"
description = "A commandline utility to download Brazil's foreign trade data"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.3.2",
]

[project.urls]
Homepage = "https://github.com/Quantilica/comex-fetcher"
Repository = "https://github.com/Quantilica/comex-fetcher"
Issues = "https://github.com/Quantilica/comex-fetcher/issues"

[project.scripts]
comex-fetcher = "comex_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
comex = "comex_fetcher.plugin:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/comex_fetcher/cli.py" = ["B008"]
"src/comex_fetcher/plugin.py" = ["B008"]
"src/comex_fetcher/__init__.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/comex_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
